name: Keep Render awake

on:
  push:
    branches: [main]
    paths: [.github/workflows/keep-render-awake.yml]
  schedule:
    # Render Free sleeps after 15 minutes without inbound traffic.
    # Use the shortest supported interval and avoid minute zero, when GitHub
    # documents the highest risk of delayed or dropped scheduled jobs.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Strapi health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep SureMandarin API active
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 60 \
            --user-agent "SureMandarin-Render-Keepalive/1.0" \
            https://api.suremandarin.com/_health
